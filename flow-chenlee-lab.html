  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    html,

  <script type="module">
    import * as THREE from "three";
    import {
      loadRunnerAssets,
      updateRunnerParticles,
      getRunnerParticleTargets,
      getRunnerBounds,
      setRunnerQuality,
    } from "./runner-model.js";

    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }
    window.scrollTo(0, 0);

    const TAU = Math.PI * 2;
    const FLOW_WIDTH = 1.34;
    const DEFAULT_QUALITY = 15000;
    const CHEN_POINTS = 120000;
    const CHEN_TRANSIENT = 8000;
    const CHEN_DT = 0.0036;
    const palette = {
      baseWhiteBlue: [0.8627, 0.9098, 0.949],
      activeCyan: [0.3412, 0.8431, 1],
      amberCadence: [0.9647, 0.6314, 0.2275],
      roseAccent: [0.8471, 0.4353, 0.6235],
    };

    const WAVE_TABLE_SIZE = 4096;
    const WAVE_TABLE_MASK = WAVE_TABLE_SIZE - 1;
    const waveTable = new Float32Array(WAVE_TABLE_SIZE);
    for (let i = 0; i < WAVE_TABLE_SIZE; i++) {
      waveTable[i] = Math.sin((i / WAVE_TABLE_SIZE) * TAU);
    }

    const scrollLab = document.querySelector("#scrollLab");
    const stickyStage = document.querySelector("#stickyStage");
    const controlProgress = document.querySelector("#progress");
    const controlAutoplay = document.querySelector("#autoplay");
    const controlPause = document.querySelector("#pause");
    const controlSpeed = document.querySelector("#speed");
    const controlQuality = document.querySelector("#quality");
    const controlLineDensity = document.querySelector("#lineDensity");
    const controlRotationSpeed = document.querySelector("#rotationSpeed");
    const controlScrollTest = document.querySelector("#scrollTest");
    const debugFps = document.querySelector("#debugFps");
    const debugCount = document.querySelector("#debugCount");
    const debugMorph = document.querySelector("#debugMorph");
    const debugMode = document.querySelector("#debugMode");
    const debugTarget = document.querySelector("#debugTarget");
    const debugDisplayed = document.querySelector("#debugDisplayed");
    const debugSlider = document.querySelector("#debugSlider");
    const debugAutoplay = document.querySelector("#debugAutoplay");
    const debugScroll = document.querySelector("#debugScroll");

    controlProgress.value = "0";
    controlAutoplay.textContent = "Autoplay off";
    controlPause.textContent = "Pause";
    controlSpeed.value = "0.72";
    controlQuality.value = String(DEFAULT_QUALITY);
    controlLineDensity.value = "0.18";
    controlRotationSpeed.value = "0.30";
    controlScrollTest.checked = false;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x05070d, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stickyStage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#05070D");

    const fieldGroup = new THREE.Group();
    scene.add(fieldGroup);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(2.8, 0.04, 0);
    camera.lookAt(0, 0, 0);

    let geometry;
    let material;
    let points;
    let lineGeometry;
    let lineMaterial;
    let lineSegments;
    let positions = new Float32Array(0);
    let colors = new Float32Array(0);
    let sizes = new Float32Array(0);
    let linePositions = new Float32Array(0);
    let lineAlphas = new Float32Array(0);
    let flowFeatures = [];
    let chenBindings = [];
    let chenPoints = new Float32Array(0);
    let chenPointBuckets = null;
    let startedAt = performance.now();
    let pausedAt = 0;
    let paused = false;
    let autoplay = false;
    let displayedProgress = 0;
    let targetProgress = 0;
    let rawScrollProgress = 0;
    let inputMode = "slider";
    let rawSliderValue = 0;
    let autoplayProgress = 0;
    let scrollProgress = 0;
    let lastProgressWriter = "slider";
    let lastDisplayedProgress = 0;
    let fps = 60;
    let previousFrameTime = performance.now();
    let previousDebugTime = 0;
    let frameIndex = 0;
    let lineCount = 0;
    let loadingQuality = false;
    let viewHalfWidth = 1;
    let viewHalfHeight = 1;
    const PROGRESS_SMOOTHING = 0.075;

    const flowPosition = new THREE.Vector3();
    const chenPosition = new THREE.Vector3();
    const streamPosition = new THREE.Vector3();
    const flowStyle = { w0: 0, w1: 0, w2: 0, w3: 0 };
    const chenStyle = { w0: 0, w1: 0, w2: 0, w3: 0 };
    const mouse = {
      active: false,
      ndcX: 0,
      ndcY: 0,
      worldY: 0,
      worldZ: 0,
    };

    function clamp01(value) {
      return Math.min(1, Math.max(0, value));
    }

    function smootherstep(value) {
      const t = clamp01(value);
      return t * t * t * (t * (t * 6 - 15) + 10);
    }

    function smoothstepRange(min, max, value) {
      const t = mapRange(value, min, max);
      return t * t * (3 - 2 * t);
    }

    function mapRange(value, min, max) {
      return clamp01((value - min) / (max - min));
    }

    function hash01(id, salt) {
      const x = Math.sin((id + 1) * 127.1 + salt * 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    function fastSin01(unitPhase) {
      return waveTable[Math.floor((unitPhase - Math.floor(unitPhase)) * WAVE_TABLE_SIZE) & WAVE_TABLE_MASK];
    }

    function fastCos01(unitPhase) {
      return fastSin01(unitPhase + 0.25);
    }

    function permuteHash(id, salt) {
      let x = ((id + 1) * 2654435761) >>> 0;
      x ^= (salt * 2246822519) >>> 0;
      x ^= x >>> 16;
      x = Math.imul(x, 2246822519) >>> 0;
      x ^= x >>> 13;
      x = Math.imul(x, 3266489917) >>> 0;
      return (x ^ (x >>> 16)) >>> 0;
    }

    function setRgbFromWeights(output, offset, w0, w1, w2, w3) {
      const total = Math.max(0.0001, w0 + w1 + w2 + w3);
      const b = w0 / total;
      const c = w1 / total;
      const a = w2 / total;
      const r = w3 / total;
      output[offset] =
        palette.baseWhiteBlue[0] * b +
        palette.activeCyan[0] * c +
        palette.amberCadence[0] * a +
        palette.roseAccent[0] * r;
      output[offset + 1] =
        palette.baseWhiteBlue[1] * b +
        palette.activeCyan[1] * c +
        palette.amberCadence[1] * a +
        palette.roseAccent[1] * r;
      output[offset + 2] =
        palette.baseWhiteBlue[2] * b +
        palette.activeCyan[2] * c +
        palette.amberCadence[2] * a +
        palette.roseAccent[2] * r;
    }

    function chenDeriv(x, y, z) {
      return [
        5 * x - y * z,
        -10 * y + x * z,
        -0.38 * z + (x * y) / 3,
      ];
    }

    function rk4Step(p, dt) {
      const k1 = chenDeriv(p[0], p[1], p[2]);
      const k2 = chenDeriv(
        p[0] + k1[0] * dt * 0.5,
        p[1] + k1[1] * dt * 0.5,
        p[2] + k1[2] * dt * 0.5
      );
      const k3 = chenDeriv(
        p[0] + k2[0] * dt * 0.5,
        p[1] + k2[1] * dt * 0.5,
        p[2] + k2[2] * dt * 0.5
      );
      const k4 = chenDeriv(
        p[0] + k3[0] * dt,
        p[1] + k3[1] * dt,
        p[2] + k3[2] * dt
      );

      p[0] += (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]) * dt / 6;
      p[1] += (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) * dt / 6;
      p[2] += (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]) * dt / 6;
    }

    function buildChenLeeTrajectory() {
      const raw = new Float32Array(CHEN_POINTS * 3);
      const p = [-0.1, -0.1, -5];
      const min = [Infinity, Infinity, Infinity];
      const max = [-Infinity, -Infinity, -Infinity];

      for (let i = 0; i < CHEN_TRANSIENT + CHEN_POINTS; i++) {
        rk4Step(p, CHEN_DT);
        if (i < CHEN_TRANSIENT) continue;

        const k = (i - CHEN_TRANSIENT) * 3;
        raw[k] = p[0];
        raw[k + 1] = p[1];
        raw[k + 2] = p[2];

        min[0] = Math.min(min[0], p[0]);
        min[1] = Math.min(min[1], p[1]);
        min[2] = Math.min(min[2], p[2]);
        max[0] = Math.max(max[0], p[0]);
        max[1] = Math.max(max[1], p[1]);
        max[2] = Math.max(max[2], p[2]);
      }

      const center = [
        (min[0] + max[0]) * 0.5,
        (min[1] + max[1]) * 0.5,
        (min[2] + max[2]) * 0.5,
      ];
      const half = Math.max(
        (max[0] - min[0]) * 0.5,
        (max[1] - min[1]) * 0.5,
        (max[2] - min[2]) * 0.5,
        0.0001
      );

      chenPoints = new Float32Array(CHEN_POINTS * 3);
      chenPointBuckets = { inner: [], outer: [], crossing: [], ambient: [] };

      for (let i = 0; i < CHEN_POINTS; i++) {
        const k = i * 3;
        const nx = (raw[k] - center[0]) / half;
        const ny = (raw[k + 1] - center[1]) / half;
        const nz = (raw[k + 2] - center[2]) / half;
        const px = nz * 0.82 + ny * 0.08;
        const py = ny * 0.76 + nz * 0.10;
        const pz = nx * 1.08;

        chenPoints[k] = px;
        chenPoints[k + 1] = py;
        chenPoints[k + 2] = pz;

        const radial = Math.sqrt(py * py + pz * pz);
        const centerPass = Math.abs(pz) < 0.22 && Math.abs(py) < 0.28;
        const phase = i / CHEN_POINTS;

        if (radial < 0.48) chenPointBuckets.inner.push(phase);
        if (radial > 0.48 && radial < 0.98) chenPointBuckets.outer.push(phase);
        if (centerPass || radial < 0.32) chenPointBuckets.crossing.push(phase);
        if (radial > 0.72 || Math.abs(px) > 0.38) chenPointBuckets.ambient.push(phase);
      }

      for (const key of Object.keys(chenPointBuckets)) {
        if (!chenPointBuckets[key].length) chenPointBuckets[key].push(0);
      }
    }

    function sampleChenAtPhase(phase, target, radialScale = 1) {
      const t = ((phase % 1) + 1) % 1;
      const f = t * (CHEN_POINTS - 1);
      const i0 = Math.floor(f);
      const i1 = (i0 + 1) % CHEN_POINTS;
      const mixT = f - i0;
      const k0 = i0 * 3;
      const k1 = i1 * 3;
      const x = mix(chenPoints[k0], chenPoints[k1], mixT) * radialScale;
      const y = mix(chenPoints[k0 + 1], chenPoints[k1 + 1], mixT) * radialScale;
      const z = mix(chenPoints[k0 + 2], chenPoints[k1 + 2], mixT) * radialScale;
      target.set(x, y, z);
      return target;
    }

    function choosePhaseFromBucket(bucket, id, salt) {
      const phases = chenPointBuckets[bucket] || chenPointBuckets.outer;
      const index = permuteHash(id, salt) % phases.length;
      const jitter = (((permuteHash(id, salt + 1) / 0xffffffff) || 0) - 0.5) * 0.0018;
      return (phases[index] + jitter + 1) % 1;
    }

    function segmentMorphProgress(progress) {
      const p0 = clamp01(progress);
      const flowHold = 1 - smoothstepRange(0.10, 0.24, p0);
      const flowToStreamP = smoothstepRange(0.10, 0.34, p0);
      const flowVisibility = flowHold;
      const flowLengthScale = mix(1.0, 0.62, smoothstepRange(0.10, 0.24, p0));
      const streamP = smoothstepRange(0.24, 0.34, p0);
      const chenSeedP = smoothstepRange(0.30, 0.34, p0) * 0.12;
      const chenP = Math.max(chenSeedP, smoothstepRange(0.34, 0.86, p0));
      const rotationP = smoothstepRange(0.34, 0.86, p0);
      const lineP = smoothstepRange(0.58, 0.90, p0);
      const settleP = smoothstepRange(0.86, 1.0, p0);
      const chenMixP = mix(chenP * 0.94, 1.0, settleP);

      return {
        p: p0,
        flowHold,
        flowToStreamP,
        flowVisibility,
        flowLengthScale,
        streamP,
        chenP,
        chenMixP,
        rotationP,
        lineP,
        settleP,
        blend: chenMixP,
      };
    }

    function updateScrollTarget() {
      const maxScroll = Math.max(1, scrollLab.offsetHeight - window.innerHeight);
      rawScrollProgress = clamp01(window.scrollY / maxScroll);
      scrollProgress = rawScrollProgress;
    }

    function setInputMode(mode) {
      inputMode = mode;
      autoplay = mode === "autoplay";
      controlAutoplay.textContent = autoplay ? "Autoplay on" : "Autoplay off";
      controlScrollTest.checked = mode === "scroll";
    }

    function writeTargetProgress(source, value) {
      const next = clamp01(value);

      if (source !== inputMode) {
        console.warn(`[progress] ignored ${source} write while inputMode is ${inputMode}`);
        return;
      }

      if (source !== lastProgressWriter && next < targetProgress - 0.06) {
        console.warn(`[progress] ${source} moved target backward from ${targetProgress.toFixed(3)} to ${next.toFixed(3)}`);
      }

      targetProgress = next;
      lastProgressWriter = source;
    }

    function syncSliderTo(value) {
      rawSliderValue = clamp01(value);
      controlProgress.value = rawSliderValue.toFixed(3);
    }

    function autoplayValue(time, speed) {
      const phase = time * 0.13 * speed;
      return 0.5 - 0.5 * Math.cos(TAU * (phase - Math.floor(phase)));
    }

    function buildBoneProfiles(targets, minY, height) {
      const profiles = new Map();

      for (let i = 0; i < targets.count; i++) {
        const binding = targets.bindings[i];
        const bone = binding ? binding.dominantBone : -1;
        if (bone < 0) continue;

        const k = i * 3;
        const yNorm = (targets.positions[k + 1] - minY) / height;
        const vx = targets.velocityHints[k];
        const vy = targets.velocityHints[k + 1];
        const vz = targets.velocityHints[k + 2];
        const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);

        let profile = profiles.get(bone);
        if (!profile) {
          profile = { count: 0, y: 0, speed: 0 };
          profiles.set(bone, profile);
        }

        profile.count += 1;
        profile.y += yNorm;
        profile.speed += speed;
      }

      let maxSpeed = 0.0001;
      for (const profile of profiles.values()) {
        profile.y /= profile.count;
        profile.speed /= profile.count;
        maxSpeed = Math.max(maxSpeed, profile.speed);
      }

      for (const profile of profiles.values()) {
        profile.speedNorm = profile.speed / maxSpeed;
      }

      return profiles;
    }

    function regionForParticle(i, yNorm, speedNorm, boneProfile) {
      const boneY = boneProfile ? boneProfile.y : yNorm;
      const boneSpeed = boneProfile ? boneProfile.speedNorm : speedNorm;
      const driftCandidate = hash01(i, 40) < 0.045 || (speedNorm > 0.78 && hash01(i, 41) < 0.16);

      if (yNorm < 0.155 || boneY < 0.13) return "foot";
      if (driftCandidate && yNorm > 0.18 && yNorm < 0.82) return "ambient";
      if (yNorm < 0.46 || boneY < 0.43) return "leg";
      if (yNorm > 0.80) return "chest";
      if (yNorm > 0.31 && yNorm < 0.73 && (speedNorm > 0.36 || boneSpeed > 0.34)) return "arm";
      if (yNorm > 0.48 && yNorm < 0.78) return "chest";
      return "torso";
    }

    function laneForRegion(region) {
      if (region === "arm") return "upper";
      if (region === "leg") return "lower";
      if (region === "foot") return "foot";
      if (region === "ambient") return "ambient";
      return "main";
    }

    function buildFlowFeatures() {
      updateRunnerParticles(0);
      const targets = getRunnerParticleTargets();
      const bounds = getRunnerBounds();
      const minY = bounds.min[1];
      const height = Math.max(0.0001, bounds.size[1]);
      const profiles = buildBoneProfiles(targets, minY, height);
      const speeds = new Float32Array(targets.count);
      let maxSpeed = 0.0001;

      for (let i = 0; i < targets.count; i++) {
        const k = i * 3;
        const vx = targets.velocityHints[k];
        const vy = targets.velocityHints[k + 1];
        const vz = targets.velocityHints[k + 2];
        const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
        speeds[i] = speed;
        maxSpeed = Math.max(maxSpeed, speed);
      }

      flowFeatures = new Array(targets.count);
      const buckets = { main: [], upper: [], lower: [], foot: [], ambient: [] };

      for (let i = 0; i < targets.count; i++) {
        const k = i * 3;
        const yNorm = (targets.positions[k + 1] - minY) / height;
        const speedNorm = speeds[i] / maxSpeed;
        const binding = targets.bindings[i];
        const boneProfile = binding ? profiles.get(binding.dominantBone) : null;
        const region = regionForParticle(i, yNorm, speedNorm, boneProfile);
        const lane = laneForRegion(region);
        const z = targets.positions[k + 2];
        const x = targets.positions[k];
        const feature = {
          id: i,
          lane,
          region,
          yNorm,
          speedNorm,
          u: 0,
          phase: hash01(i, 50) * TAU,
          phase2: hash01(i, 51) * TAU,
          spread: hash01(i, 52),
          depthSign: hash01(i, 53) < 0.5 ? -1 : 1,
          delay: hash01(i, 54) * 0.07,
          footSpark: region === "foot" && hash01(i, 55) < 0.36,
          sortKey: z + x * 0.2 + hash01(i, 56) * 0.08,
          lastAmber: 0,
          flowSize: mix(0.00085, 0.00175, hash01(i, 57)),
        };

        if (lane === "ambient") {
          feature.sortKey = hash01(i, 58) * 2 - 1;
          feature.flowSize = mix(0.00065, 0.0013, hash01(i, 59));
        }

        buckets[lane].push(feature);
        flowFeatures[i] = feature;
      }

      for (const lane of Object.values(buckets)) {
        lane.sort((a, b) => a.sortKey - b.sortKey);
        const denom = Math.max(1, lane.length);
        for (let rank = 0; rank < lane.length; rank++) {
          lane[rank].u = clamp01((rank + 0.5) / denom + (hash01(lane[rank].id, 60) - 0.5) * 0.018);
        }
      }
    }

    function buildChenBindings() {
      const targets = getRunnerParticleTargets();
      chenBindings = new Array(targets.count);

      for (let i = 0; i < targets.count; i++) {
        const feature = flowFeatures[i];
        let bucket = "outer";
        let radialScale = 0.86;
        let drift = 0.010;

        if (feature.lane === "main") {
          bucket = "inner";
          radialScale = feature.region === "chest" ? 0.66 : 0.72;
          drift = 0.009;
        } else if (feature.lane === "upper" || feature.lane === "lower") {
          bucket = "outer";
          radialScale = feature.lane === "upper" ? 0.94 : 1.02;
          drift = 0.0115;
        } else if (feature.lane === "foot") {
          bucket = "crossing";
          radialScale = 0.82;
          drift = 0.0135;
        } else if (feature.lane === "ambient") {
          bucket = "ambient";
          radialScale = mix(1.02, 1.22, hash01(i, 72));
          drift = 0.0075;
        }

        chenBindings[i] = {
          phase: choosePhaseFromBucket(bucket, i, 70),
          drift,
          radialScale,
          orbitOffset: (hash01(i, 73) - 0.5) * 0.012,
          lineEligible: hash01(i, 74) < 0.09,
        };
      }
    }

    function computeFlowPosition(feature, time, target) {
      const breath = 0.5 + 0.5 * fastSin01(time * 0.22);
      const local = (feature.u + time * 0.030 + feature.speedNorm * 0.016) % 1;
      const centered = local * 2 - 1;
      const lanePhase =
        feature.lane === "upper" ? 0.18 :
        feature.lane === "lower" ? 0.52 :
        feature.lane === "foot" ? 0.76 :
        feature.lane === "ambient" ? feature.spread : 0.0;
      let z = centered * FLOW_WIDTH;
      let x = 0;
      let y = 0;
      let laneAmp = 0.08;
      let laneBreath = 0.016;
      let laneThickness = 0.045;

      if (feature.lane === "main") {
        y = 0.005;
        laneAmp = feature.region === "chest" ? 0.135 : 0.105;
        laneBreath = feature.region === "chest" ? 0.038 : 0.022;
        laneThickness = feature.region === "chest" ? 0.055 : 0.048;
        x = (feature.spread - 0.5) * 0.035;
      } else if (feature.lane === "upper") {
        y = 0.27;
        laneAmp = 0.092;
        laneBreath = 0.016;
        laneThickness = 0.040;
        x = 0.018 * feature.depthSign + (feature.spread - 0.5) * 0.04;
      } else if (feature.lane === "lower") {
        y = -0.285;
        laneAmp = 0.105;
        laneBreath = 0.012;
        laneThickness = 0.046;
        x = -0.012 * feature.depthSign + (feature.spread - 0.5) * 0.042;
      } else if (feature.lane === "foot") {
        y = -0.47;
        laneAmp = 0.072;
        laneBreath = 0.008;
        laneThickness = 0.030;
        x = (feature.spread - 0.5) * 0.038;
      } else {
        z = centered * (FLOW_WIDTH + 0.22);
        y = mix(-0.62, 0.54, hash01(feature.id, 61));
        x = mix(-0.16, 0.16, hash01(feature.id, 62));
        laneAmp = 0.026;
        laneBreath = 0.016;
      }

      const primary = fastSin01(local * 1.35 - time * 0.105 + lanePhase);
      const secondary = fastSin01(local * 3.7 + time * 0.055 + lanePhase * 0.72);
      const inhaleCurl = fastSin01(local * 0.62 + breath * 0.18 + lanePhase * 0.38 + (feature.phase * 0.12) / TAU);
      const envelope = 0.74 + breath * 0.34;
      const pulseBase = 0.5 + 0.5 * fastSin01(local * 4.0 - time * 0.78 + feature.phase2 / TAU);
      const pulse2 = pulseBase * pulseBase;
      const pulse4 = pulse2 * pulse2;
      const pulse = pulse4 * pulse4 * pulseBase;

      y += (primary * 0.58 + secondary * 0.24 + inhaleCurl * 0.18) * laneAmp * envelope;
      y += (breath - 0.5) * laneBreath;
      y += (feature.spread - 0.5) * laneThickness;
      x += fastSin01(local * 2.2 + time * 0.046 + feature.phase / TAU) * 0.018;
      z += fastSin01(time * 0.08 + (feature.phase * 0.15) / TAU) * 0.012;

      if (feature.lane === "foot") {
        y += pulse * 0.15;
        z += fastSin01(local * 8.0 - time * 1.05) * 0.018 * pulse;
        feature.lastAmber = feature.footSpark ? pulse : 0;
      } else {
        feature.lastAmber = 0;
      }

      if (feature.lane === "ambient") {
        y += fastSin01(time * 0.05 + feature.spread) * 0.032;
        x += fastCos01(time * 0.04 + feature.u) * 0.032;
      }

      target.set(x, y, z);
      return target;
    }

    function computeChenPosition(binding, feature, time, speed, target) {
      const phase = binding.phase + time * speed * binding.drift + binding.orbitOffset;
      sampleChenAtPhase(phase, target, binding.radialScale);

      if (feature.lane === "ambient") {
        const float = fastSin01(time * 0.035 + feature.spread) * 0.035;
        target.x += (hash01(feature.id, 80) - 0.5) * 0.09;
        target.y += float;
        target.z += (hash01(feature.id, 81) - 0.5) * 0.10;
      }

      return target;
    }

    function computeTwistedStreamPosition(flow, feature, time, target) {
      const lanePhase =
        feature.lane === "upper" ? 0.19 :
        feature.lane === "lower" ? 0.47 :
        feature.lane === "foot" ? 0.68 :
        feature.lane === "ambient" ? 0.83 : 0.04;
      const laneY =
        feature.lane === "upper" ? 0.24 :
        feature.lane === "lower" ? -0.24 :
        feature.lane === "foot" ? -0.43 :
        feature.lane === "ambient" ? mix(-0.54, 0.48, feature.spread) : 0.0;
      const openU = (feature.u - 0.5) * 2;
      const edgeTaper = 1 - Math.abs(openU) * 0.34;
      const twist = openU * (2.35 + feature.speedNorm * 0.42) + lanePhase * TAU + time * 0.17;
      const secondary = openU * 4.2 + feature.phase2 / TAU + lanePhase * 1.7 - time * 0.055;
      const laneSpread = (feature.spread - 0.5);
      const laneOffset = (feature.lane === "upper" || feature.lane === "lower")
        ? (feature.lane === "upper" ? 0.05 : -0.05)
        : 0;

      target.z = openU * mix(0.82, 0.70, feature.speedNorm) + laneOffset;
      target.z += fastSin01(secondary) * 0.055 * edgeTaper;
      target.z += laneSpread * 0.035;
      target.x = fastSin01(twist / TAU) * 0.23 * edgeTaper;
      target.x += fastSin01(secondary * 0.37 + feature.spread) * 0.055;
      target.x += feature.depthSign * mix(0.018, 0.052, feature.speedNorm);
      target.y = mix(flow.y, laneY, 0.58);
      target.y += fastCos01(twist / TAU + feature.spread * 0.11) * 0.082 * edgeTaper;
      target.y += laneSpread * 0.026;

      if (feature.lane === "ambient") {
        target.x += laneSpread * 0.14;
        target.y += fastSin01(time * 0.035 + feature.spread) * 0.045;
        target.z += mix(-0.24, 0.24, hash01(feature.id, 82));
      }

      return target;
    }

    function flowWeights(feature) {
      if (feature.lane === "foot") {
        const amber = feature.footSpark ? 0.12 + feature.lastAmber * 0.48 : 0.02;
        flowStyle.w0 = 0.64 - amber * 0.18;
        flowStyle.w1 = 0.13;
        flowStyle.w2 = amber;
        flowStyle.w3 = 0.02;
      } else if (feature.lane === "upper") {
        flowStyle.w0 = 0.64;
        flowStyle.w1 = 0.30;
        flowStyle.w2 = 0.0;
        flowStyle.w3 = 0.03;
      } else if (feature.lane === "lower") {
        flowStyle.w0 = 0.72;
        flowStyle.w1 = 0.20;
        flowStyle.w2 = 0.0;
        flowStyle.w3 = 0.02;
      } else if (feature.lane === "ambient") {
        flowStyle.w0 = 0.52;
        flowStyle.w1 = 0.22;
        flowStyle.w2 = 0.0;
        flowStyle.w3 = 0.10;
      } else if (feature.region === "chest") {
        flowStyle.w0 = 0.68;
        flowStyle.w1 = 0.31;
        flowStyle.w2 = 0.0;
        flowStyle.w3 = 0.02;
      } else {
        flowStyle.w0 = 0.76;
        flowStyle.w1 = 0.19;
        flowStyle.w2 = 0.0;
        flowStyle.w3 = 0.02;
      }

      return flowStyle;
    }

    function chenWeights(feature, binding) {
      if (feature.lane === "foot") {
        const amber = feature.footSpark ? 0.14 + feature.lastAmber * 0.34 : 0.03;
        chenStyle.w0 = 0.56;
        chenStyle.w1 = 0.22;
        chenStyle.w2 = amber;
        chenStyle.w3 = 0.08;
      } else if (feature.lane === "ambient") {
        chenStyle.w0 = 0.38;
        chenStyle.w1 = 0.22;
        chenStyle.w2 = 0.0;
        chenStyle.w3 = 0.20;
      } else if (binding.radialScale > 0.9) {
        chenStyle.w0 = 0.56;
        chenStyle.w1 = 0.27;
        chenStyle.w2 = 0.0;
        chenStyle.w3 = 0.12;
      } else {
        chenStyle.w0 = 0.66;
        chenStyle.w1 = 0.29;
        chenStyle.w2 = 0.0;
        chenStyle.w3 = 0.04;
      }

      return chenStyle;
    }

    function buildPointCloud() {
      const targets = getRunnerParticleTargets();
      positions = new Float32Array(targets.count * 3);
      colors = new Float32Array(targets.count * 3);
      sizes = new Float32Array(targets.count);

      geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("particleColor", new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute("particleSize", new THREE.BufferAttribute(sizes, 1));

      material = new THREE.ShaderMaterial({
        uniforms: {
          uDpr: { value: Math.min(window.devicePixelRatio || 1, 2) },
          uViewportHeight: { value: window.innerHeight },
          uSizeScale: { value: 0.98 },
        },
        vertexShader: `
          attribute vec3 particleColor;
          attribute float particleSize;
          varying vec3 vColor;
          uniform float uDpr;
          uniform float uViewportHeight;
          uniform float uSizeScale;

          void main() {
            vColor = particleColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = max(1.0, particleSize * uViewportHeight * uSizeScale * uDpr);
          }
        `,
        fragmentShader: `
          precision mediump float;
          varying vec3 vColor;

          void main() {
            vec2 uv = gl_PointCoord - vec2(0.5);
            float d = length(uv);
            float alpha = (1.0 - smoothstep(0.18, 0.5, d)) * 0.9;
            alpha += (1.0 - smoothstep(0.0, 0.18, d)) * 0.10;
            if (alpha < 0.015) discard;
            gl_FragColor = vec4(vColor, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        depthTest: true,
      });

      points = new THREE.Points(geometry, material);
      points.frustumCulled = false;
      fieldGroup.add(points);
    }

    function buildLineCloud() {
      if (lineSegments) {
        fieldGroup.remove(lineSegments);
        lineGeometry.dispose();
        lineMaterial.dispose();
      }

      lineCount = Math.floor(Number(controlLineDensity.value) * 650);
      linePositions = new Float32Array(lineCount * 2 * 3);
      lineAlphas = new Float32Array(lineCount);
      lineGeometry = new THREE.BufferGeometry();
      lineGeometry.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
      lineMaterial = new THREE.LineBasicMaterial({
        color: 0x8fdfff,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        depthTest: true,
      });
      lineSegments = new THREE.LineSegments(lineGeometry, lineMaterial);
      lineSegments.frustumCulled = false;
      fieldGroup.add(lineSegments);
    }

    function rebuildAll() {
      if (points) {
        fieldGroup.remove(points);
        geometry.dispose();
        material.dispose();
      }

      buildFlowFeatures();
      buildChenBindings();
      buildPointCloud();
      buildLineCloud();
      frameIndex = 0;
      debugCount.textContent = getRunnerParticleTargets().count.toString();
    }

    function updateLines(time, lineP, speed) {
      if (!lineSegments || lineCount <= 0) return;

      const density = Number(controlLineDensity.value);
      lineMaterial.opacity = lineP * density * 0.18;
      if (lineMaterial.opacity <= 0.002) return;

      for (let i = 0; i < lineCount; i++) {
        const phase = (i * 0.61803398875 + time * speed * 0.004 + hash01(i, 90) * 0.04) % 1;
        const radialScale = mix(0.72, 1.04, hash01(i, 91));
        const k = i * 6;
        sampleChenAtPhase(phase, chenPosition, radialScale);
        linePositions[k] = chenPosition.x;
        linePositions[k + 1] = chenPosition.y;
        linePositions[k + 2] = chenPosition.z;
        sampleChenAtPhase(phase + 0.000035 + hash01(i, 92) * 0.000055, chenPosition, radialScale);
        linePositions[k + 3] = chenPosition.x;
        linePositions[k + 4] = chenPosition.y;
        linePositions[k + 5] = chenPosition.z;
      }

      lineGeometry.attributes.position.needsUpdate = true;
    }

    function updateCamera(progress) {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const flowDistanceForWidth = (FLOW_WIDTH * 1.92) / (2 * Math.tan(hFov / 2));
      const flowDistanceForHeight = 1.34 / (2 * Math.tan(vFov / 2));
      const flowDistance = Math.max(flowDistanceForWidth, flowDistanceForHeight) * 0.92;
      const chenDistanceForWidth = 1.78 / (2 * Math.tan(hFov / 2));
      const chenDistanceForHeight = 1.38 / (2 * Math.tan(vFov / 2));
      const chenDistance = Math.max(1.58, chenDistanceForWidth, chenDistanceForHeight) * 0.96;
      const push = smootherstep(progress);
      const distance = mix(flowDistance, chenDistance, push);
      const targetY = mix(-0.015, 0.02, push);

      camera.position.set(distance, 0.05, 0);
      camera.lookAt(0, targetY, 0);
      viewHalfHeight = Math.tan(vFov / 2) * distance;
      viewHalfWidth = viewHalfHeight * camera.aspect;
      mouse.worldZ = mouse.ndcX * viewHalfWidth;
      mouse.worldY = targetY + mouse.ndcY * viewHalfHeight;
    }

    function applyMouseAttraction(k, strength) {
      if (!mouse.active || strength <= 0) return;

      const dx = -positions[k] * 0.28;
      const dy = mouse.worldY - positions[k + 1];
      const dz = mouse.worldZ - positions[k + 2];
      const r2 = dx * dx + dy * dy + dz * dz;
      const pull = strength * Math.exp(-r2 / 0.11);

      positions[k] += dx * pull;
      positions[k + 1] += dy * pull;
      positions[k + 2] += dz * pull;
    }

    function currentTime(now) {
      if (paused) return pausedAt;
      return (now - startedAt) / 1000;
    }

    function render(now) {
      requestAnimationFrame(render);
      if (!points || loadingQuality) return;

      const elapsed = currentTime(now);
      const dt = Math.max(1, now - previousFrameTime);
      previousFrameTime = now;
      fps = mix(fps, Math.min(120, 1000 / dt), 0.08);

      updateScrollTarget();
      const speed = Number(controlSpeed.value);
      autoplayProgress = autoplayValue(elapsed, speed);

      if (inputMode === "autoplay") {
        writeTargetProgress("autoplay", autoplayProgress);
      } else if (inputMode === "scroll") {
        writeTargetProgress("scroll", scrollProgress);
      } else {
        writeTargetProgress("slider", rawSliderValue);
      }

      lastDisplayedProgress = displayedProgress;
      displayedProgress += (targetProgress - displayedProgress) * PROGRESS_SMOOTHING;
      if (Math.abs(displayedProgress - targetProgress) < 0.0004) displayedProgress = targetProgress;

      if (displayedProgress < lastDisplayedProgress - 0.08 && targetProgress >= lastDisplayedProgress - 0.01) {
        console.warn(`[progress] displayedProgress stepped backward in ${inputMode} mode`);
      }

      if (inputMode === "slider") {
        controlProgress.value = rawSliderValue.toFixed(3);
      } else {
        controlProgress.value = displayedProgress.toFixed(3);
      }

      const segment = segmentMorphProgress(displayedProgress);
      const targets = getRunnerParticleTargets();
      const updateStyle = frameIndex % 2 === 0 || segment.blend < 0.002 || segment.blend > 0.998;
      const mouseStrength = 0.018 + segment.blend * 0.010;
      frameIndex += 1;

      updateCamera(segment.blend);

      for (let i = 0; i < targets.count; i++) {
        const feature = flowFeatures[i];
        const binding = chenBindings[i];
        const k = i * 3;

        const localBlend = segment.chenMixP <= 0
          ? 0
          : clamp01((segment.chenMixP - feature.delay * 0.12) / (1 - feature.delay * 0.12));
        const flow = computeFlowPosition(feature, elapsed * speed, flowPosition);
        const flowTighten = segment.flowToStreamP;
        flow.x *= mix(1.0, 0.62, flowTighten);
        flow.y *= mix(1.0, 0.84, flowTighten * 0.72);
        flow.z *= segment.flowLengthScale;
        let streamX = flow.x;
        let streamY = flow.y;
        let streamZ = flow.z;

        if (segment.streamP > 0) {
          const stream = computeTwistedStreamPosition(flow, feature, elapsed * speed, streamPosition);
          streamX = mix(flow.x, stream.x, segment.streamP);
          streamY = mix(flow.y, stream.y, segment.streamP);
          streamZ = mix(flow.z, stream.z, segment.streamP);
        }

        if (localBlend > 0) {
          const chen = computeChenPosition(binding, feature, elapsed, speed, chenPosition);
          positions[k] = mix(streamX, chen.x, localBlend);
          positions[k + 1] = mix(streamY, chen.y, localBlend);
          positions[k + 2] = mix(streamZ, chen.z, localBlend);
        } else {
          positions[k] = streamX;
          positions[k + 1] = streamY;
          positions[k + 2] = streamZ;
        }
        applyMouseAttraction(k, mouseStrength);

        if (updateStyle) {
          const c = i * 3;
          const fw = flowWeights(feature);
          const aw = chenWeights(feature, binding);
          setRgbFromWeights(
            colors,
            c,
            mix(fw.w0, aw.w0, localBlend),
            mix(fw.w1, aw.w1, localBlend),
            mix(fw.w2, aw.w2, localBlend),
            mix(fw.w3, aw.w3, localBlend)
          );

          sizes[i] = mix(feature.flowSize, feature.flowSize * mix(0.84, 1.16, hash01(i, 93)), localBlend);
        }
      }

      geometry.attributes.position.needsUpdate = true;
      if (updateStyle) {
        geometry.attributes.particleColor.needsUpdate = true;
        geometry.attributes.particleSize.needsUpdate = true;
      }

      updateLines(elapsed, segment.lineP, speed);
      const cameraRotation = 0;
      const attractorIdleRotation = segment.rotationP;
      const actualRotation = Number(controlRotationSpeed.value) * elapsed * attractorIdleRotation;
      fieldGroup.rotation.y = cameraRotation + attractorIdleRotation * 0.54 + actualRotation * 0.12;
      fieldGroup.rotation.x = attractorIdleRotation * (0.07 + 0.035 * fastSin01(elapsed * 0.035));
      renderer.render(scene, camera);

      if (now - previousDebugTime > 120) {
        previousDebugTime = now;
        debugFps.textContent = Math.round(fps).toString();
        debugCount.textContent = targets.count.toString();
        debugMorph.textContent = displayedProgress.toFixed(3);
        debugMode.textContent = inputMode;
        debugTarget.textContent = targetProgress.toFixed(3);
        debugDisplayed.textContent = displayedProgress.toFixed(3);
        debugSlider.textContent = rawSliderValue.toFixed(3);
        debugAutoplay.textContent = autoplayProgress.toFixed(3);
        debugScroll.textContent = scrollProgress.toFixed(3);
      }
    }

    controlProgress.addEventListener("input", () => {
      setInputMode("slider");
      syncSliderTo(Number(controlProgress.value));
      writeTargetProgress("slider", rawSliderValue);
    });

    controlAutoplay.addEventListener("click", () => {
      if (inputMode === "autoplay") {
        setInputMode("slider");
        syncSliderTo(displayedProgress);
        writeTargetProgress("slider", rawSliderValue);
      } else {
        setInputMode("autoplay");
        writeTargetProgress("autoplay", autoplayProgress);
      }
    });

    controlPause.addEventListener("click", () => {
      paused = !paused;
      controlPause.textContent = paused ? "Play" : "Pause";
      if (paused) {
        pausedAt = (performance.now() - startedAt) / 1000;
      } else {
        startedAt = performance.now() - pausedAt * 1000;
      }
    });

    controlQuality.addEventListener("change", () => {
      loadingQuality = true;
      setRunnerQuality(Number(controlQuality.value));
      rebuildAll();
      loadingQuality = false;
    });

    controlLineDensity.addEventListener("input", () => {
      buildLineCloud();
    });

    controlScrollTest.addEventListener("change", () => {
      if (controlScrollTest.checked) {
        setInputMode("scroll");
        updateScrollTarget();
        writeTargetProgress("scroll", scrollProgress);
      } else {
        setInputMode("slider");
        syncSliderTo(displayedProgress);
        writeTargetProgress("slider", rawSliderValue);
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (material) {
        material.uniforms.uDpr.value = Math.min(window.devicePixelRatio || 1, 2);
        material.uniforms.uViewportHeight.value = window.innerHeight;
      }
      updateScrollTarget();
    });

    window.addEventListener("pointermove", (event) => {
      mouse.active = true;
      mouse.ndcX = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.ndcY = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener("pointerleave", () => {
      mouse.active = false;
    });

    const initialProgressRaw = new URLSearchParams(window.location.search).get("progress");
    const initialProgressParam = Number(initialProgressRaw);
    if (initialProgressRaw !== null && Number.isFinite(initialProgressParam)) {
      setInputMode("slider");
      syncSliderTo(initialProgressParam);
      writeTargetProgress("slider", rawSliderValue);
      displayedProgress = targetProgress;
      lastDisplayedProgress = targetProgress;
    }

    buildChenLeeTrajectory();
    await loadRunnerAssets({ quality: DEFAULT_QUALITY });
    rebuildAll();
    updateScrollTarget();
    startedAt = performance.now();
    previousFrameTime = startedAt;
    requestAnimationFrame(render);
  </script>
</body>
</html>
