<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scroll Morph Lab</title>
  <script>
    if (window.location.protocol === "file:") {
      window.location.replace("http://127.0.0.1:5177/");
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      background: #05070d;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 320vh;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-color: rgba(87, 215, 255, 0.35) #05070d;
    }

    .scroll-lab {
      height: 320vh;
      background: #05070d;
    }

    .sticky-stage {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #05070d;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #05070d;
    }

    .debug-panel {
      position: fixed;
      left: 18px;
      top: 18px;
      width: min(300px, calc(100vw - 36px));
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px solid rgba(220, 232, 242, 0.16);
      border-radius: 8px;
      background: rgba(5, 7, 13, 0.76);
      backdrop-filter: blur(12px);
      box-sizing: border-box;
      color: rgba(220, 232, 242, 0.78);
      font-size: 12px;
      letter-spacing: 0;
      user-select: none;
      z-index: 2;
    }

    .debug-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .debug-value {
      color: #dce8f2;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <section id="scrollLab" class="scroll-lab">
    <div id="stickyStage" class="sticky-stage"></div>
  </section>

  <div class="debug-panel" aria-label="scroll morph debug">
    <div class="debug-row">
      <span>scrollProgress</span>
      <span id="debugScroll" class="debug-value">0.000</span>
    </div>
    <div class="debug-row">
      <span>morphProgress</span>
      <span id="debugMorph" class="debug-value">0.000</span>
    </div>
    <div class="debug-row">
      <span>FPS</span>
      <span id="debugFps" class="debug-value">0</span>
    </div>
    <div class="debug-row">
      <span>particleCount</span>
      <span id="debugCount" class="debug-value">15000</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import {
      loadRunnerAssets,
      updateRunnerParticles,
      getRunnerParticleTargets,
      getRunnerBounds,
    } from "./runner-model.js";

    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }
    window.scrollTo(0, 0);

    const TAU = Math.PI * 2;
    const FLOW_WIDTH = 1.34;
    const DEFAULT_QUALITY = 15000;
    const palette = {
      baseWhiteBlue: [0.8627, 0.9098, 0.949],
      activeCyan: [0.3412, 0.8431, 1],
      amberCadence: [0.9647, 0.6314, 0.2275],
      roseAccent: [0.8471, 0.4353, 0.6235],
    };
    const WAVE_TABLE_SIZE = 4096;
    const WAVE_TABLE_MASK = WAVE_TABLE_SIZE - 1;
    const waveTable = new Float32Array(WAVE_TABLE_SIZE);

    for (let i = 0; i < WAVE_TABLE_SIZE; i++) {
      waveTable[i] = Math.sin((i / WAVE_TABLE_SIZE) * TAU);
    }

    const scrollLab = document.querySelector("#scrollLab");
    const stickyStage = document.querySelector("#stickyStage");
    const debugScroll = document.querySelector("#debugScroll");
    const debugMorph = document.querySelector("#debugMorph");
    const debugFps = document.querySelector("#debugFps");
    const debugCount = document.querySelector("#debugCount");

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x05070d, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stickyStage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#05070D");

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(2.8, 0.02, 0);
    camera.lookAt(0, 0, 0);

    let geometry;
    let material;
    let points;
    let positions = new Float32Array(0);
    let colors = new Float32Array(0);
    let sizes = new Float32Array(0);
    let flowFeatures = [];
    let startedAt = performance.now();
    let frameIndex = 0;
    let rawScrollProgress = 0;
    let targetProgress = 0;
    let displayedProgress = 0;
    let fps = 60;
    let previousFrameTime = performance.now();
    let previousDebugTime = 0;
    let viewHalfWidth = 1;
    let viewHalfHeight = 1;

    const flowPosition = new THREE.Vector3();
    const flowStyle = { w0: 0, w1: 0, w2: 0, w3: 0 };
    const mouse = {
      active: false,
      ndcX: 0,
      ndcY: 0,
      worldY: 0,
      worldZ: 0,
    };

    function clamp01(value) {
      return Math.min(1, Math.max(0, value));
    }

    function smootherstep(value) {
      const t = clamp01(value);
      return t * t * t * (t * (t * 6 - 15) + 10);
    }

    function mapRange(value, min, max) {
      return clamp01((value - min) / (max - min));
    }

    function softSnapProgress(value) {
      const t = clamp01(value);
      const snapRange = 0.055;

      if (t < 0.012) return 0;
      if (t > 0.988) return 1;
      if (t < snapRange) return (t * t) / snapRange;
      if (t > 1 - snapRange) {
        const d = 1 - t;
        return 1 - (d * d) / snapRange;
      }

      return t;
    }

    function segmentMorphProgress(progress) {
      const p = clamp01(progress);

      if (p < 0.24) {
        return { blend: 0, expand: 0, phase: 0 };
      }

      if (p < 0.46) {
        const t = smootherstep(mapRange(p, 0.24, 0.46));
        return { blend: 0, expand: t, phase: 1 };
      }

      if (p < 0.86) {
        const t = smootherstep(mapRange(p, 0.46, 0.86));
        const held = t < 0.55
          ? 0.52 * smootherstep(t / 0.55)
          : 0.52 + 0.48 * smootherstep((t - 0.55) / 0.45);
        return { blend: held, expand: 1 - t, phase: 2 };
      }

      return { blend: 1, expand: 0, phase: 3 };
    }

    function updateScrollTarget() {
      const maxScroll = Math.max(1, scrollLab.offsetHeight - window.innerHeight);
      rawScrollProgress = clamp01(window.scrollY / maxScroll);
      targetProgress = softSnapProgress(rawScrollProgress);
    }

    function hash01(id, salt) {
      const x = Math.sin((id + 1) * 127.1 + salt * 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    function fastSin01(unitPhase) {
      return waveTable[Math.floor((unitPhase - Math.floor(unitPhase)) * WAVE_TABLE_SIZE) & WAVE_TABLE_MASK];
    }

    function fastCos01(unitPhase) {
      return fastSin01(unitPhase + 0.25);
    }

    function setRgbFromWeights(output, offset, w0, w1, w2, w3) {
      const total = Math.max(0.0001, w0 + w1 + w2 + w3);
      const b = w0 / total;
      const c = w1 / total;
      const a = w2 / total;
      const r = w3 / total;
      output[offset] =
        palette.baseWhiteBlue[0] * b +
        palette.activeCyan[0] * c +
        palette.amberCadence[0] * a +
        palette.roseAccent[0] * r;
      output[offset + 1] =
        palette.baseWhiteBlue[1] * b +
        palette.activeCyan[1] * c +
        palette.amberCadence[1] * a +
        palette.roseAccent[1] * r;
      output[offset + 2] =
        palette.baseWhiteBlue[2] * b +
        palette.activeCyan[2] * c +
        palette.amberCadence[2] * a +
        palette.roseAccent[2] * r;
    }

    function buildBoneProfiles(targets, minY, height) {
      const profiles = new Map();

      for (let i = 0; i < targets.count; i++) {
        const binding = targets.bindings[i];
        const bone = binding ? binding.dominantBone : -1;
        if (bone < 0) continue;

        const k = i * 3;
        const yNorm = (targets.positions[k + 1] - minY) / height;
        const vx = targets.velocityHints[k];
        const vy = targets.velocityHints[k + 1];
        const vz = targets.velocityHints[k + 2];
        const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);

        let profile = profiles.get(bone);
        if (!profile) {
          profile = { count: 0, y: 0, speed: 0 };
          profiles.set(bone, profile);
        }

        profile.count += 1;
        profile.y += yNorm;
        profile.speed += speed;
      }

      let maxSpeed = 0.0001;
      for (const profile of profiles.values()) {
        profile.y /= profile.count;
        profile.speed /= profile.count;
        maxSpeed = Math.max(maxSpeed, profile.speed);
      }

      for (const profile of profiles.values()) {
        profile.speedNorm = profile.speed / maxSpeed;
      }

      return profiles;
    }

    function regionForParticle(i, yNorm, speedNorm, boneProfile) {
      const boneY = boneProfile ? boneProfile.y : yNorm;
      const boneSpeed = boneProfile ? boneProfile.speedNorm : speedNorm;
      const driftCandidate = hash01(i, 40) < 0.045 || (speedNorm > 0.78 && hash01(i, 41) < 0.16);

      if (yNorm < 0.155 || boneY < 0.13) return "foot";
      if (driftCandidate && yNorm > 0.18 && yNorm < 0.82) return "ambient";
      if (yNorm < 0.46 || boneY < 0.43) return "leg";
      if (yNorm > 0.80) return "chest";
      if (yNorm > 0.31 && yNorm < 0.73 && (speedNorm > 0.36 || boneSpeed > 0.34)) return "arm";
      if (yNorm > 0.48 && yNorm < 0.78) return "chest";
      return "torso";
    }

    function laneForRegion(region) {
      if (region === "arm") return "upper";
      if (region === "leg") return "lower";
      if (region === "foot") return "foot";
      if (region === "ambient") return "ambient";
      return "main";
    }

    function buildFlowFeatures() {
      updateRunnerParticles(0);
      const targets = getRunnerParticleTargets();
      const bounds = getRunnerBounds();
      const minY = bounds.min[1];
      const height = Math.max(0.0001, bounds.size[1]);
      const profiles = buildBoneProfiles(targets, minY, height);
      const speeds = new Float32Array(targets.count);
      let maxSpeed = 0.0001;

      for (let i = 0; i < targets.count; i++) {
        const k = i * 3;
        const vx = targets.velocityHints[k];
        const vy = targets.velocityHints[k + 1];
        const vz = targets.velocityHints[k + 2];
        const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
        speeds[i] = speed;
        maxSpeed = Math.max(maxSpeed, speed);
      }

      flowFeatures = new Array(targets.count);
      const buckets = {
        main: [],
        upper: [],
        lower: [],
        foot: [],
        ambient: [],
      };

      for (let i = 0; i < targets.count; i++) {
        const k = i * 3;
        const yNorm = (targets.positions[k + 1] - minY) / height;
        const speedNorm = speeds[i] / maxSpeed;
        const binding = targets.bindings[i];
        const boneProfile = binding ? profiles.get(binding.dominantBone) : null;
        const region = regionForParticle(i, yNorm, speedNorm, boneProfile);
        const lane = laneForRegion(region);
        const z = targets.positions[k + 2];
        const x = targets.positions[k];
        const feature = {
          id: i,
          lane,
          region,
          yNorm,
          speedNorm,
          u: 0,
          sourceX: x,
          sourceY: targets.positions[k + 1],
          sourceZ: z,
          phase: hash01(i, 50) * TAU,
          phase2: hash01(i, 51) * TAU,
          spread: hash01(i, 52),
          depthSign: hash01(i, 53) < 0.5 ? -1 : 1,
          delay: hash01(i, 54) * 0.08,
          footSpark: region === "foot" && hash01(i, 55) < 0.36,
          sortKey: z + x * 0.2 + hash01(i, 56) * 0.08,
          lastAmber: 0,
          flowSize: mix(0.00085, 0.00175, hash01(i, 57)),
        };

        if (lane === "ambient") {
          feature.sortKey = hash01(i, 58) * 2 - 1;
          feature.flowSize = mix(0.00065, 0.0013, hash01(i, 59));
        }

        buckets[lane].push(feature);
        flowFeatures[i] = feature;
      }

      for (const lane of Object.values(buckets)) {
        lane.sort((a, b) => a.sortKey - b.sortKey);
        const denom = Math.max(1, lane.length);
        for (let rank = 0; rank < lane.length; rank++) {
          lane[rank].u = clamp01((rank + 0.5) / denom + (hash01(lane[rank].id, 60) - 0.5) * 0.018);
        }
      }
    }

    function computeFlowPosition(feature, time, target) {
      const breath = 0.5 + 0.5 * fastSin01(time * 0.22);
      const local = (feature.u + time * 0.030 + feature.speedNorm * 0.016) % 1;
      const centered = local * 2 - 1;
      const lanePhase =
        feature.lane === "upper"
          ? 0.18
          : feature.lane === "lower"
            ? 0.52
            : feature.lane === "foot"
              ? 0.76
              : feature.lane === "ambient"
                ? feature.spread
                : 0.0;
      let z = centered * FLOW_WIDTH;
      let x = 0;
      let y = 0;
      let laneAmp = 0.08;
      let laneBreath = 0.016;
      let laneThickness = 0.045;

      if (feature.lane === "main") {
        y = 0.005;
        laneAmp = feature.region === "chest" ? 0.135 : 0.105;
        laneBreath = feature.region === "chest" ? 0.038 : 0.022;
        laneThickness = feature.region === "chest" ? 0.055 : 0.048;
        x = (feature.spread - 0.5) * 0.035;
      } else if (feature.lane === "upper") {
        y = 0.27;
        laneAmp = 0.092;
        laneBreath = 0.016;
        laneThickness = 0.040;
        x = 0.018 * feature.depthSign + (feature.spread - 0.5) * 0.04;
      } else if (feature.lane === "lower") {
        y = -0.285;
        laneAmp = 0.105;
        laneBreath = 0.012;
        laneThickness = 0.046;
        x = -0.012 * feature.depthSign + (feature.spread - 0.5) * 0.042;
      } else if (feature.lane === "foot") {
        y = -0.47;
        laneAmp = 0.072;
        laneBreath = 0.008;
        laneThickness = 0.030;
        x = (feature.spread - 0.5) * 0.038;
      } else {
        z = centered * (FLOW_WIDTH + 0.22);
        y = mix(-0.62, 0.54, hash01(feature.id, 61));
        x = mix(-0.16, 0.16, hash01(feature.id, 62));
        laneAmp = 0.026;
        laneBreath = 0.016;
      }

      const primary = fastSin01(local * 1.35 - time * 0.105 + lanePhase);
      const secondary = fastSin01(local * 3.7 + time * 0.055 + lanePhase * 0.72);
      const inhaleCurl = fastSin01(local * 0.62 + breath * 0.18 + lanePhase * 0.38 + (feature.phase * 0.12) / TAU);
      const envelope = 0.74 + breath * 0.34;
      const pulseBase = 0.5 + 0.5 * fastSin01(local * 4.0 - time * 0.78 + feature.phase2 / TAU);
      const pulse2 = pulseBase * pulseBase;
      const pulse4 = pulse2 * pulse2;
      const pulse = pulse4 * pulse4 * pulseBase;

      y += (primary * 0.58 + secondary * 0.24 + inhaleCurl * 0.18) * laneAmp * envelope;
      y += (breath - 0.5) * laneBreath;
      y += (feature.spread - 0.5) * laneThickness;
      x += fastSin01(local * 2.2 + time * 0.046 + feature.phase / TAU) * 0.018;
      z += fastSin01(time * 0.08 + (feature.phase * 0.15) / TAU) * 0.012;

      if (feature.lane === "foot") {
        y += pulse * 0.15;
        z += fastSin01(local * 8.0 - time * 1.05) * 0.018 * pulse;
        feature.lastAmber = feature.footSpark ? pulse : 0;
      } else {
        feature.lastAmber = 0;
      }

      if (feature.lane === "ambient") {
        y += fastSin01(time * 0.05 + feature.spread) * 0.032;
        x += fastCos01(time * 0.04 + feature.u) * 0.032;
      }

      target.set(x, y, z);
      return target;
    }

    function flowWeights(feature) {
      if (feature.lane === "foot") {
        const amber = feature.footSpark ? 0.12 + feature.lastAmber * 0.48 : 0.02;
        flowStyle.w0 = 0.64 - amber * 0.18;
        flowStyle.w1 = 0.13;
        flowStyle.w2 = amber;
        flowStyle.w3 = 0.02;
        return flowStyle;
      }

      if (feature.lane === "upper") {
        flowStyle.w0 = 0.64;
        flowStyle.w1 = 0.30;
        flowStyle.w2 = 0.0;
        flowStyle.w3 = 0.03;
      } else if (feature.lane === "lower") {
        flowStyle.w0 = 0.72;
        flowStyle.w1 = 0.20;
        flowStyle.w2 = 0.0;
        flowStyle.w3 = 0.02;
      } else if (feature.lane === "ambient") {
        flowStyle.w0 = 0.52;
        flowStyle.w1 = 0.22;
        flowStyle.w2 = 0.0;
        flowStyle.w3 = 0.10;
      } else if (feature.region === "chest") {
        flowStyle.w0 = 0.68;
        flowStyle.w1 = 0.31;
        flowStyle.w2 = 0.0;
        flowStyle.w3 = 0.02;
      } else {
        flowStyle.w0 = 0.76;
        flowStyle.w1 = 0.19;
        flowStyle.w2 = 0.0;
        flowStyle.w3 = 0.02;
      }

      return flowStyle;
    }

    function buildPointCloud() {
      const targets = getRunnerParticleTargets();
      positions = new Float32Array(targets.positions.length);
      colors = new Float32Array(targets.count * 3);
      sizes = new Float32Array(targets.count);

      geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("particleColor", new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute("particleSize", new THREE.BufferAttribute(sizes, 1));

      material = new THREE.ShaderMaterial({
        uniforms: {
          uDpr: { value: Math.min(window.devicePixelRatio || 1, 2) },
          uViewportHeight: { value: window.innerHeight },
          uSizeScale: { value: 0.98 },
        },
        vertexShader: `
          attribute vec3 particleColor;
          attribute float particleSize;
          varying vec3 vColor;
          uniform float uDpr;
          uniform float uViewportHeight;
          uniform float uSizeScale;

          void main() {
            vColor = particleColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = max(1.0, particleSize * uViewportHeight * uSizeScale * uDpr);
          }
        `,
        fragmentShader: `
          precision mediump float;
          varying vec3 vColor;

          void main() {
            vec2 uv = gl_PointCoord - vec2(0.5);
            float d = length(uv);
            float alpha = (1.0 - smoothstep(0.18, 0.5, d)) * 0.9;
            alpha += (1.0 - smoothstep(0.0, 0.18, d)) * 0.10;
            if (alpha < 0.015) discard;
            gl_FragColor = vec4(vColor, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        depthTest: true,
      });

      points = new THREE.Points(geometry, material);
      points.frustumCulled = false;
      scene.add(points);
    }

    function updateCamera(morphProgress, scrollProgress) {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const runnerBounds = getRunnerBounds();
      const runnerWidth = Math.max(0.7, runnerBounds.size[2]);
      const runnerHeight = Math.max(1.0, runnerBounds.size[1]);
      const runnerDistanceForWidth = runnerWidth / (2 * Math.tan(hFov / 2));
      const runnerDistanceForHeight = runnerHeight / (2 * Math.tan(vFov / 2));
      const runnerDistance = Math.max(2.45, runnerDistanceForWidth, runnerDistanceForHeight) * 1.12;
      const flowDistanceForWidth = (FLOW_WIDTH * 1.92) / (2 * Math.tan(hFov / 2));
      const flowDistanceForHeight = 1.34 / (2 * Math.tan(vFov / 2));
      const flowDistance = Math.max(flowDistanceForWidth, flowDistanceForHeight) * 0.92;
      const flowPush = smootherstep(mapRange(scrollProgress, 0.34, 0.94));
      const morphPush = smootherstep(morphProgress);
      const push = clamp01(flowPush * 0.72 + morphPush * 0.28);
      const distance = mix(runnerDistance, flowDistance, push);
      const targetY = mix(0, -0.015, push);

      camera.position.set(distance, 0.02, 0);
      camera.lookAt(0, targetY, 0);
      viewHalfHeight = Math.tan(vFov / 2) * distance;
      viewHalfWidth = viewHalfHeight * camera.aspect;
      mouse.worldZ = mouse.ndcX * viewHalfWidth;
      mouse.worldY = targetY + mouse.ndcY * viewHalfHeight;
    }

    function applyMouseAttraction(k, strength) {
      if (!mouse.active || strength <= 0) return;

      const dx = -positions[k] * 0.35;
      const dy = mouse.worldY - positions[k + 1];
      const dz = mouse.worldZ - positions[k + 2];
      const r2 = dx * dx + dy * dy + dz * dz;
      const pull = strength * Math.exp(-r2 / 0.12);

      positions[k] += dx * pull;
      positions[k + 1] += dy * pull;
      positions[k + 2] += dz * pull;
    }

    function renderScrollLab(now) {
      requestAnimationFrame(renderScrollLab);
      if (!points) return;

      const elapsed = (now - startedAt) / 1000;
      const dt = Math.max(1, now - previousFrameTime);
      previousFrameTime = now;
      fps = mix(fps, Math.min(120, 1000 / dt), 0.08);
      updateScrollTarget();
      displayedProgress = mix(displayedProgress, targetProgress, 0.06);
      if (Math.abs(displayedProgress - targetProgress) < 0.0004) displayedProgress = targetProgress;

      const segment = segmentMorphProgress(displayedProgress);
      const needsRunnerUpdate = segment.blend < 0.998 || segment.expand > 0.001;
      const targets = needsRunnerUpdate ? updateRunnerParticles(elapsed) : getRunnerParticleTargets();
      const runnerPositions = targets.positions;
      const runnerWeights = targets.colorWeights;
      const runnerSizes = targets.sizes;
      const globalBreath = 0.5 + 0.5 * fastSin01(elapsed * 0.22);
      const updateStyle = frameIndex % 2 === 0 || segment.blend < 0.002 || segment.blend > 0.998;
      const mouseStrength = 0.020 + segment.blend * 0.010;
      const runnerOnly = segment.blend <= 0.0001 && segment.expand <= 0.0001;
      frameIndex += 1;
      updateCamera(segment.blend, displayedProgress);

      for (let i = 0; i < targets.count; i++) {
        const feature = flowFeatures[i];
        const k = i * 3;
        const localP = runnerOnly
          ? 0
          : segment.blend <= 0
          ? 0
          : segment.blend >= 1
            ? 1
            : smootherstep((segment.blend - feature.delay) / (1 - feature.delay));
        const rx = runnerPositions[k];
        const ry = runnerPositions[k + 1];
        const rz = runnerPositions[k + 2];

        if (runnerOnly) {
          positions[k] = rx;
          positions[k + 1] = ry;
          positions[k + 2] = rz;
        } else {
          const flow = computeFlowPosition(feature, elapsed, flowPosition);
          const outwardLength = Math.max(0.0001, Math.sqrt(rx * rx * 0.18 + ry * ry + rz * rz));
          const expand = segment.expand * 0.045 * (0.62 + globalBreath * 0.38) * (1 - localP * 0.25);
          const ex = (rx * 0.18 + feature.depthSign * 0.018) / outwardLength;
          const ey = ry / outwardLength;
          const ez = rz / outwardLength;

          positions[k] = mix(rx, flow.x, localP) + ex * expand;
          positions[k + 1] = mix(ry, flow.y, localP) + ey * expand;
          positions[k + 2] = mix(rz, flow.z, localP) + ez * expand;
        }

        applyMouseAttraction(k, mouseStrength);

        if (updateStyle) {
          const w = i * 4;
          const c = i * 3;
          const fw = flowWeights(feature);
          setRgbFromWeights(
            colors,
            c,
            mix(runnerWeights[w], fw.w0, localP),
            mix(runnerWeights[w + 1], fw.w1, localP),
            mix(runnerWeights[w + 2], fw.w2, localP),
            mix(runnerWeights[w + 3], fw.w3, localP)
          );

          sizes[i] = mix(runnerSizes[i], feature.flowSize, localP);
        }
      }

      geometry.attributes.position.needsUpdate = true;
      if (updateStyle) {
        geometry.attributes.particleColor.needsUpdate = true;
        geometry.attributes.particleSize.needsUpdate = true;
      }
      renderer.render(scene, camera);

      if (now - previousDebugTime > 120) {
        previousDebugTime = now;
        debugScroll.textContent = rawScrollProgress.toFixed(3);
        debugMorph.textContent = segment.blend.toFixed(3);
        debugFps.textContent = Math.round(fps).toString();
        debugCount.textContent = targets.count.toString();
      }
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (material) {
        material.uniforms.uDpr.value = Math.min(window.devicePixelRatio || 1, 2);
        material.uniforms.uViewportHeight.value = window.innerHeight;
      }
      updateScrollTarget();
    });

    window.addEventListener("pointermove", (event) => {
      mouse.active = true;
      mouse.ndcX = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.ndcY = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener("pointerleave", () => {
      mouse.active = false;
    });

    await loadRunnerAssets({ quality: DEFAULT_QUALITY });
    buildFlowFeatures();
    buildPointCloud();
    updateScrollTarget();
    displayedProgress = targetProgress;
    debugCount.textContent = getRunnerParticleTargets().count.toString();
    startedAt = performance.now();
    previousFrameTime = startedAt;
    requestAnimationFrame(renderScrollLab);
  </script>
</body>
</html>
